name: Windows

# Builds the Windows archives: the official MSVC 2022 x86_64 binaries with the
# patched modules rebuilt and installed over them. Run by hand; the archives
# come back as workflow artifacts, and a maintainer uploads them to the mirror
# and tags the commit they were built from.
on:
  workflow_dispatch:
    inputs:
      qt:
        description: Qt version
        default: "6.12.0"
      revision:
        description: Build revision (goes up whenever the patch set or the recipe changes)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      WORK: C:\qtw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}
      - name: Build
        run: python -I scripts/build-windows.py --qt ${{ inputs.qt }} --work ${{ env.WORK }}
      - name: Package
        run: python -I scripts/package-windows.py --qt ${{ inputs.qt }} --revision ${{ inputs.revision }} --work ${{ env.WORK }}
      - name: Disk left
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}
      - uses: actions/upload-artifact@v4
        with:
          name: qt-${{ inputs.qt }}-windows-msvc2022_64-${{ inputs.revision }}
          path: ${{ env.WORK }}\dist\*.tar.xz
          compression-level: 0
          retention-days: 14
