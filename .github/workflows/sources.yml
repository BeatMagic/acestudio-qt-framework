name: Sources

# Every pinned source archive still verifies against its SHA-256, every patch still
# applies to it, and every file declares its license.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify, and patch every pinned version
        run: |
          for v in qt/*/; do
            v=$(basename "$v")
            python3 -I scripts/prepare-sources.py --qt "$v" --out "$RUNNER_TEMP/src-$v" --all
          done
      - name: Every file declares its license
        run: pipx run --spec 'reuse[charset-normalizer]' reuse lint
